%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file
% Case: Gaia rocket (single stage, 5-fin) - external aerodynamics
% Physics: Inviscid (Euler), compressible
% Condition: Sea-level, Mach 1.20, 0 deg angle of attack
% Part of a Mach sweep - see run_mach_sweep.sh
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ----------
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION ------------------
MACH_NUMBER= 1.200
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_OPTION= TEMPERATURE_FS
INIT_OPTION= TD_CONDITIONS

% ---------------------- REFERENCE VALUE DEFINITION --------------------------
REF_ORIGIN_MOMENT_X= 1.175      % rocket mid-length (placeholder - update with actual CG)
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 2.35                % overall rocket length [m]
REF_AREA= 0.014314              % reference area = pi*(0.135/2)^2 [m^2]
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE

% ----------------------------- FLUID MODEL ----------------------------------
FLUID_MODEL= STANDARD_AIR

% -------------------- BOUNDARY CONDITION DEFINITION -------------------------
MARKER_EULER= ( ROCKET )
MARKER_FAR= ( FARFIELD )
MARKER_PLOTTING= ( ROCKET )
MARKER_MONITORING= ( ROCKET )

% ------------- COMMON PARAMETERS TO DEFINE THE NUMERICAL METHOD -------------
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 1.5
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 2.0, 1.0, 100.0 )
ITER= 5000

% ----------------------- SLOPE LIMITER DEFINITION ---------------------------
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% -------------------------- MULTIGRID PARAMETERS -----------------------------
MGLEVEL= 2
MGCYCLE= W_CYCLE
MG_PRE_SMOOTH= ( 1, 2, 3, 3 )
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
MG_DAMP_RESTRICTION= 0.75
MG_DAMP_PROLONGATION= 0.75

% -------------------- FLOW NUMERICAL METHOD DEFINITION ----------------------
CONV_NUM_METHOD_FLOW= ROE
ROE_KAPPA= 0.5
ENTROPY_FIX_COEFF= 0.001
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ------------------------------- INPUT/OUTPUT ---------------------------------
MESH_FILENAME= ../gaia.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= gaia_out_M1.20.su2
SOLUTION_FILENAME= restart_flow_M1.20.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= history_M1.20
RESTART_FILENAME= restart_flow_M1.20.dat
VOLUME_FILENAME= flow_M1.20
SURFACE_FILENAME= surface_flow_M1.20
OUTPUT_WRT_FREQ= 250
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_ENERGY, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW )
